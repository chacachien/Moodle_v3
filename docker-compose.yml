version: '3'
services:
  moodle:
    build: .
    ports:
      - "8002:80"
    volumes:
      - type: bind
        source: .
        target: /var/www/html
      - moodledata:/var/www/html/data/moodledata4113
    environment:
      - MOODLE_DOCKER_WWWROOT=http://localhost:8002

volumes:
  moodledata: